[package]
name = "team-clock"
version = "0.1.0"
edition = "2024"
description = "See the local time of everyone in a global team on a world map"
license = "MIT"
exclude = ["tools/"]

[dependencies]
eframe = { version = "0.37", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
chrono = "0.4"
chrono-tz = "0.10"
iana-time-zone = "0.1"
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
toml_edit = "0.25"
directories = "6.0"
anyhow = "1.0"

[dev-dependencies]
proptest = "1.12"

[profile.release]
lto = "thin"
strip = true
